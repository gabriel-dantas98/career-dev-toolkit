[project]
name = "careeros"
version = "0.2.0"
description = "Local-first CareerOS Python runtime"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.7.0",
    "sqlcipher3>=0.6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["careeros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
