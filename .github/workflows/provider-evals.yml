name: provider-evals

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Providers to evaluate
        required: true
        default: both
        type: choice
        options:
          - both
          - claude
          - cursor
      runs:
        description: Fresh runs per baseline and candidate arm
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
      max_invocations:
        description: Hard ceiling across subject and judge calls
        required: true
        default: 60
        type: number
      judge:
        description: Optional independent judge
        required: true
        default: none
        type: choice
        options:
          - none
          - claude
          - cursor

permissions:
  contents: read

concurrency:
  group: provider-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: advisory provider certification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Select authenticated providers
        env:
          REQUESTED_PROVIDERS: ${{ inputs.providers }}
          REQUESTED_JUDGE: ${{ inputs.judge }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          summary() {
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          providers=()
          installers=()

          if [[ "$REQUESTED_PROVIDERS" == "both" || "$REQUESTED_PROVIDERS" == "claude" ]]; then
            if [[ -n "$ANTHROPIC_API_KEY" ]]; then
              providers+=("claude")
              installers+=("claude")
            else
              summary "### Claude: skipped — ANTHROPIC_API_KEY is unavailable"
            fi
          fi

          if [[ "$REQUESTED_PROVIDERS" == "both" || "$REQUESTED_PROVIDERS" == "cursor" ]]; then
            if [[ -n "$CURSOR_API_KEY" ]]; then
              providers+=("cursor")
              installers+=("cursor")
            else
              summary "### Cursor: skipped — CURSOR_API_KEY is unavailable"
            fi
          fi

          judge=""
          if [[ "$REQUESTED_JUDGE" == "claude" && -n "$ANTHROPIC_API_KEY" ]]; then
            judge="claude"
            installers+=("claude")
          elif [[ "$REQUESTED_JUDGE" == "cursor" && -n "$CURSOR_API_KEY" ]]; then
            judge="cursor"
            installers+=("cursor")
          elif [[ "$REQUESTED_JUDGE" != "none" ]]; then
            summary "### Judge: unavailable — its credential is missing"
          fi

          eval_providers="$(IFS=,; echo "${providers[*]}")"
          eval_installers="$(IFS=,; echo "${installers[*]}")"
          {
            echo "EVAL_PROVIDERS=$eval_providers"
            echo "EVAL_INSTALLERS=$eval_installers"
            echo "EVAL_JUDGE=$judge"
          } >> "$GITHUB_ENV"

          if [[ -z "$eval_providers" ]]; then
            summary "### Provider certification: skipped — no requested provider is authenticated"
          fi

      - name: Install Claude Code
        if: contains(env.EVAL_INSTALLERS, 'claude')
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install Cursor agent
        if: contains(env.EVAL_INSTALLERS, 'cursor')
        run: curl https://cursor.com/install -fsS | bash

      - name: Run advisory certification
        if: env.EVAL_PROVIDERS != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          EVAL_RUNS: ${{ inputs.runs }}
          EVAL_MAX_INVOCATIONS: ${{ inputs.max_invocations }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          args=(
            --providers "$EVAL_PROVIDERS"
            --runs "$EVAL_RUNS"
            --max-invocations "$EVAL_MAX_INVOCATIONS"
          )
          if [[ -n "$EVAL_JUDGE" ]]; then
            args+=(--judge "$EVAL_JUDGE")
          fi
          npm run eval:providers -- "${args[@]}"

      - name: Publish report summary
        if: always() && env.EVAL_PROVIDERS != ''
        run: |
          latest="$(find .eval-results -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          if [[ -n "$latest" && -f "$latest/summary.md" ]]; then
            cat "$latest/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized provider reports
        if: always() && env.EVAL_PROVIDERS != ''
        uses: actions/upload-artifact@v4
        with:
          name: provider-evals-${{ github.run_id }}
          path: .eval-results/
          if-no-files-found: warn
          retention-days: 14
